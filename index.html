<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><title>Assortment Line Planner</title></head><body class="locked">
<title>Assortment Line Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#F1F2EF;--surface:#FFFFFF;--surface-2:#F7F8F6;--ink:#1B1F22;--muted:#5D666C;--rule:#D8DCD8;--rule-2:#E7EAE6;
  --accent:#A65F12;--accent-ink:#FFFFFF;--accent-soft:#F6EBDD;
  --ok:#23804A;--ok-soft:#E3F2E8;--warn:#A86A00;--warn-soft:#FBF0D8;--bad:#B3261E;--bad-soft:#F9E3E1;
  --l-fgc2:#D42A3A;--l-polin:#0B8FCB;--l-wafer:#E0A100;--l-fgc1:#2A9A4D;--l-laser:#2A2E33;
  --off:#E6E8E4;--over:#2F6DB0;--over-soft:#E3ECF7;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;--bg:#111416;--surface:#191D20;--surface-2:#1F2427;--ink:#E6E9EB;--muted:#9AA3A9;--rule:#2F363A;--rule-2:#262C2F;
  --accent:#E09A45;--accent-ink:#1A1206;--accent-soft:#33261A;
  --ok:#5CC486;--ok-soft:#173222;--warn:#E7B24C;--warn-soft:#352812;--bad:#F07A70;--bad-soft:#3A1C1A;
  --l-fgc2:#F0505E;--l-polin:#38B3EA;--l-wafer:#F2C230;--l-fgc1:#4CC274;--l-laser:#C4CBD1;--off:#1C2023;--over:#7FB0E6;--over-soft:#17263A;
}}
:root[data-theme="dark"]{
  color-scheme:dark;--bg:#111416;--surface:#191D20;--surface-2:#1F2427;--ink:#E6E9EB;--muted:#9AA3A9;--rule:#2F363A;--rule-2:#262C2F;
  --accent:#E09A45;--accent-ink:#1A1206;--accent-soft:#33261A;
  --ok:#5CC486;--ok-soft:#173222;--warn:#E7B24C;--warn-soft:#352812;--bad:#F07A70;--bad-soft:#3A1C1A;
  --l-fgc2:#F0505E;--l-polin:#38B3EA;--l-wafer:#F2C230;--l-fgc1:#4CC274;--l-laser:#C4CBD1;--off:#1C2023;--over:#7FB0E6;--over-soft:#17263A;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--sans);padding:0}
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
aside.side{position:sticky;top:env(safe-area-inset-top,0px);height:100vh;overflow-y:auto;background:var(--surface);border-right:1px solid var(--rule);padding:20px 14px;display:flex;flex-direction:column;gap:18px}
.brand{font:700 22px/1.02 var(--display);text-transform:uppercase;letter-spacing:.02em;margin:0;padding:0 6px}
.brand small{display:block;font:500 11px var(--sans);letter-spacing:.06em;color:var(--muted);margin-top:6px;text-transform:uppercase}
.side nav{display:flex;flex-direction:column;gap:2px}
.side .ng{font:600 10.5px var(--sans);text-transform:uppercase;letter-spacing:.12em;color:var(--muted);padding:12px 8px 4px}
.side nav button{display:flex;align-items:center;gap:10px;text-align:left;font:600 15px var(--display);letter-spacing:.05em;text-transform:uppercase;background:none;border:0;color:var(--muted);padding:8px 10px;border-radius:2px;cursor:pointer;border-left:3px solid transparent}
.side nav button:hover{color:var(--ink);background:var(--surface-2)}
.side nav button[aria-selected="true"]{color:var(--ink);background:var(--accent-soft);border-left-color:var(--accent)}
.side nav button .ic{width:18px;text-align:center;font:600 12px var(--mono);color:var(--muted)}
.side nav button.inp[aria-selected="true"] .ic,.side nav button.inp .ic{color:var(--accent)}
.sidekpi{display:grid;gap:8px;border-top:1px solid var(--rule);padding:14px 6px 0}
.sidekpi div{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted)}
.sidekpi b{font:600 13px var(--mono);color:var(--ink)}
.side .sync{margin-top:auto;padding:0 6px}
.content{padding:20px 24px 48px;min-width:0}
.content .inner{max-width:1240px;margin:0 auto;display:grid;gap:14px}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  aside.side{position:static;height:auto;border-right:0;border-bottom:1px solid var(--rule);padding:14px 16px;gap:10px}
  .side nav{flex-direction:row;overflow-x:auto;gap:4px}
  .side .ng{display:none}
  .side nav button{white-space:nowrap;border-left:0;border-bottom:3px solid transparent}
  .side nav button[aria-selected="true"]{border-bottom-color:var(--accent)}
  .sidekpi{grid-template-columns:repeat(2,minmax(0,1fr));border-top:0;padding:0}
  .content{padding:16px 16px 40px}
}
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;padding-block:22px 14px;border-bottom:2px solid var(--ink)}
h1{font:700 34px/1 var(--display);letter-spacing:.01em;margin:0;text-transform:uppercase;text-wrap:balance}
.sub{color:var(--muted);font-size:13px;margin-top:6px}
.sync{font:500 12px var(--mono);color:var(--muted);display:flex;align-items:center;gap:8px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.sync[data-s="saved"] .dot{background:var(--ok)}.sync[data-s="saving"] .dot{background:var(--warn)}.sync[data-s="error"] .dot{background:var(--bad)}
nav.tabs{display:flex;gap:2px;overflow-x:auto;margin-top:14px;border-bottom:1px solid var(--rule)}
nav.tabs button{font:600 15px var(--display);letter-spacing:.06em;text-transform:uppercase;background:none;border:0;color:var(--muted);padding:10px 14px;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
nav.tabs button:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{display:grid;gap:22px}
h2{font:700 20px/1.1 var(--display);text-transform:uppercase;letter-spacing:.04em;margin:0}
h3{font:600 16px/1.2 var(--display);text-transform:uppercase;letter-spacing:.05em;margin:0}
.muted{color:var(--muted)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--rule);border:1px solid var(--rule)}
.kpi{background:var(--surface);padding:14px 16px;display:grid;gap:4px}
.kpi .l{font:600 12px var(--sans);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.kpi .v{font:600 30px/1 var(--display);letter-spacing:.01em}
.kpi .s{font-size:12px;color:var(--muted)}
@media (max-width:760px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.two{display:grid;grid-template-columns:1.25fr 1fr;gap:22px;align-items:start}
@media (max-width:900px){.two{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--rule);padding:16px;display:grid;gap:14px;min-width:0}
.recs{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.rec{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;padding:10px 12px;background:var(--surface-2);border-left:4px solid var(--muted)}
.rec[data-k="go"]{border-left-color:var(--ok)}.rec[data-k="warn"]{border-left-color:var(--warn)}.rec[data-k="bad"]{border-left-color:var(--bad)}.rec[data-k="info"]{border-left-color:var(--accent)}
.rec .tag{font:700 11px var(--mono);text-transform:uppercase;letter-spacing:.06em;padding:2px 6px;background:var(--surface);border:1px solid var(--rule);white-space:nowrap}
.rec b{font-weight:600}
.loadrow{display:grid;grid-template-columns:78px 1fr 92px;gap:10px;align-items:center}
.lname{font:700 15px var(--display);letter-spacing:.05em;display:flex;align-items:center;gap:6px;white-space:nowrap}
.sw{width:10px;height:10px;display:inline-block;flex:none}
.bar{height:18px;background:var(--off);position:relative}
.bar i{position:absolute;inset:0 auto 0 0;display:block}
.chip{display:inline-block;font:600 11px var(--sans);letter-spacing:.03em;padding:2px 8px;border-radius:2px;white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)}.chip.warn{background:var(--warn-soft);color:var(--warn)}.chip.bad{background:var(--bad-soft);color:var(--bad)}.chip.idle{background:var(--off);color:var(--muted)}
.tablebox{overflow-x:auto;border:1px solid var(--rule);background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:760px}
table.compact{min-width:520px}
th,td{padding:7px 10px;text-align:left;border-bottom:1px solid var(--rule-2);vertical-align:middle}
th{font:600 11px var(--sans);text-transform:uppercase;letter-spacing:.07em;color:var(--muted);background:var(--surface-2);position:sticky;top:0;z-index:1}
td.r,th.r{text-align:right}
tr.group td{background:var(--surface-2);font:700 14px var(--display);text-transform:uppercase;letter-spacing:.06em;padding-top:10px}
tr.dim td{color:var(--muted)}
input[type=number],input[type=date],select{font:500 13px var(--mono);color:var(--ink);background:var(--surface);border:1px solid var(--rule);padding:5px 6px;border-radius:2px;min-width:0}
input[type=number]{width:92px;text-align:right}
input.in{background:var(--accent-soft);border-color:transparent}
input.in:focus{background:var(--surface);border-color:var(--accent)}
.dots{display:inline-flex;gap:3px;margin-left:6px;vertical-align:middle}
.pname{font-weight:500}
.toolbar{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between}
.toolbar .grp{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button.btn{font:600 13px var(--sans);padding:7px 12px;border:1px solid var(--rule);background:var(--surface);color:var(--ink);cursor:pointer;border-radius:2px}
button.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.btn.danger{color:var(--bad);border-color:var(--bad)}
label.tog{display:inline-flex;gap:6px;align-items:center;font-size:13px;cursor:pointer}
.linecards{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:16px}
@media (max-width:420px){.linecards{grid-template-columns:1fr}}
.lc{background:var(--surface);border:1px solid var(--rule);border-top:6px solid var(--lc);display:grid;align-content:start;min-width:0}
.lc header{display:flex;justify-content:space-between;align-items:baseline;padding:12px 14px 8px;gap:10px;flex-wrap:wrap}
.lc .big{font:600 26px/1 var(--display)}
.lc .facts{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--rule-2);border-bottom:1px solid var(--rule-2)}
.lc .facts div{padding:8px 14px;display:grid}
.lc .facts span{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.lc table{min-width:0;font-size:13px}
.lc td,.lc th{padding:5px 10px}
.lc .none{padding:14px;color:var(--muted)}
.settings{display:flex;flex-wrap:wrap;gap:14px 22px;align-items:flex-end}
.field{display:grid;gap:4px;font-size:12px;color:var(--muted)}
.field b{font:600 11px var(--sans);text-transform:uppercase;letter-spacing:.07em}
.days{display:flex;gap:4px}
.days button{font:600 12px var(--mono);width:34px;padding:5px 0;border:1px solid var(--rule);background:var(--surface);color:var(--muted);cursor:pointer}
.days.mode button{width:auto;padding:5px 10px;font-family:var(--sans)}
.days button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.hpd{display:flex;flex-wrap:wrap;gap:10px}
.hpd label{display:flex;align-items:center;gap:6px;font:600 13px var(--display);letter-spacing:.05em;color:var(--ink)}
.hpd input{width:58px}
.gantt{overflow-x:auto;border:1px solid var(--rule);background:var(--surface)}
.g-inner{position:relative}
.g-head,.g-row{display:grid;grid-template-columns:96px 1fr}
.g-head .cells,.g-row .track{position:relative;display:flex}
.g-head .c{flex:none;border-left:1px solid var(--rule-2);font:500 11px var(--mono);color:var(--muted);padding:6px 4px;text-align:center}
.g-head .c.off{background:var(--off)}
.g-head .c b{display:block;color:var(--ink);font-weight:600}
.g-row{border-top:1px solid var(--rule-2);min-height:46px}
.g-lab{padding:8px 10px;font:700 15px var(--display);letter-spacing:.05em;display:flex;align-items:center;gap:6px;background:var(--surface);position:sticky;left:0;z-index:2;border-right:1px solid var(--rule)}
.g-head .g-lab{font:600 11px var(--sans);color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
.track .c{flex:none;border-left:1px solid var(--rule-2);height:100%}
.track .c.off{background:repeating-linear-gradient(135deg,var(--off) 0 6px,transparent 6px 12px)}
.blk{position:absolute;top:7px;bottom:7px;overflow:hidden;font:600 11px/1.15 var(--sans);color:#fff;padding:3px 5px;white-space:nowrap;text-overflow:ellipsis;border-right:2px solid var(--surface);cursor:default}
.blk.light{color:#1B1F22}
.blk.co{background:repeating-linear-gradient(90deg,var(--rule) 0 2px,transparent 2px 4px)!important}
.runs{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:16px}
@media (max-width:420px){.runs{grid-template-columns:1fr}}
ol.seq{margin:0;padding:0;list-style:none;counter-reset:s}
ol.seq li{counter-increment:s;display:grid;grid-template-columns:26px 1fr auto;gap:8px;padding:7px 12px;border-top:1px solid var(--rule-2);align-items:baseline}
ol.seq li::before{content:counter(s);font:600 12px var(--mono);color:var(--muted)}
ol.seq .when{font:500 12px var(--mono);color:var(--muted);text-align:right}
ol.seq .why{grid-column:2/4;font-size:12px;color:var(--muted)}
.notes{display:grid;gap:12px;max-width:820px}
.note{background:var(--surface);border:1px solid var(--rule);padding:14px 16px}
.note p{margin:6px 0 0}
.confirm{display:inline-flex;gap:6px;align-items:center;font-size:13px}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.ro-note{padding:8px 12px;background:var(--warn-soft);color:var(--warn);font-size:13px}
.rk{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 4px;background:var(--ink);color:var(--bg);font:600 12px var(--mono);margin-right:4px}
input.bignum{width:100%;max-width:240px;font:600 24px var(--mono);padding:6px 8px;text-align:left}
input.locked-in,select.locked-in{background:transparent!important;border-color:transparent!important;color:var(--ink);opacity:1}
[hidden]{display:none!important}
body.locked .app{display:none}
body:not(.locked) .login{display:none}
.login{min-height:100vh;display:grid;place-items:center;padding:24px 16px}
.login-card{width:100%;max-width:400px;background:var(--surface);border:1px solid var(--rule);border-top:6px solid var(--accent);padding:24px;display:grid;gap:14px}
.login-card .brand{padding:0}
.lgf{display:grid;gap:14px}
.login-card input{font:500 15px var(--sans);padding:10px;border:1px solid var(--rule);background:var(--surface);color:var(--ink);border-radius:2px;width:100%}
.login-card .btn{padding:10px}
.linkbtn{background:none;border:0;color:var(--accent);font:500 13px var(--sans);cursor:pointer;justify-self:start;padding:0}
.lg-msg{font-size:13px;color:var(--bad);min-height:1em}
.lg-msg.ok{color:var(--ok)}
.who{font-size:12px;color:var(--muted);padding:0 6px;display:grid;gap:6px;word-break:break-word}
.who .row{display:flex;gap:6px;flex-wrap:wrap}
.panel input[type=text],.panel input[type=email],.panel input[type=password]{font:500 13px var(--sans);color:var(--ink);background:var(--surface);border:1px solid var(--rule);padding:6px 8px;border-radius:2px}
.chip.over{background:var(--over-soft);color:var(--over)}
tr.pos-short td{background:var(--bad-soft)}
tr.pos-over td{background:var(--over-soft)}
tr.pos-short td:first-child{box-shadow:inset 4px 0 0 var(--bad)}
tr.pos-over td:first-child{box-shadow:inset 4px 0 0 var(--over)}
tr.pos-ok td:first-child{box-shadow:inset 4px 0 0 var(--ok)}
.pb{position:relative;height:12px;background:var(--off)}
.pb-s{position:absolute;inset:0 auto 0 0;background:var(--muted);opacity:.55}
tr.pos-short .pb-s{background:var(--bad);opacity:.8}tr.pos-over .pb-s{background:var(--over);opacity:.8}tr.pos-ok .pb-s{background:var(--ok);opacity:.8}
.pb-r{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink)}
.scards{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
@media (max-width:980px){.scards{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:420px){.scards{grid-template-columns:1fr}}
.sc{background:var(--surface);border:1px solid var(--rule);border-top:5px solid var(--lc);padding:10px 12px;display:grid;gap:4px}
.sc h3{display:flex;align-items:center;gap:6px;margin-bottom:4px}
.sc-row{display:flex;justify-content:space-between;gap:8px;font-size:13px}
.sc-row span{color:var(--muted)}
.sc-row.short b{color:var(--bad)}.sc-row.over b{color:var(--over)}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .3s ease}}
</style>

<div id="login" class="login"><div class="login-card">
  <h1 class="brand">Assortment Line Planner<small>Continental Brands · production planning</small></h1>
  <form id="loginForm" class="lgf" autocomplete="on">
    <label class="field"><b>Email</b><input type="email" id="lg-email" autocomplete="username" required></label>
    <label class="field"><b>Password</b><input type="password" id="lg-pass" autocomplete="current-password" required></label>
    <button class="btn primary" type="submit" id="lg-go">Sign in</button>
    <button class="linkbtn" type="button" id="lg-reset">Forgot password?</button>
  </form>
  <form id="setupForm" class="lgf" hidden autocomplete="off">
    <p style="margin:0;font-size:13px">First time: create the <b>administrator</b> account. The administrator adds everyone else from inside the planner.</p>
    <label class="field"><b>Your name</b><input type="text" id="su-name" required></label>
    <label class="field"><b>Email</b><input type="email" id="su-email" required></label>
    <label class="field"><b>Password</b><input type="password" id="su-pass" required autocomplete="new-password"></label>
    <button class="btn primary" type="submit" id="su-go">Create administrator</button>
  </form>
  <div class="lg-msg" id="lg-msg" role="status"></div>
</div></div>
<div class="app">
<aside class="side">
  <h1 class="brand">Assortment Line Planner<small>FGC2 · Polin · Wafer · FGC1 · Laser</small></h1>
  <nav id="tabs" aria-label="Sections">
    <div class="ng">Enter</div>
    <button class="inp" data-t="orders" aria-selected="false"><span class="ic">✎</span>Orders</button>
    <button class="inp" data-t="entry" aria-selected="false"><span class="ic">✎</span>Stock &amp; daily entry</button>
    <div class="ng">Plan</div>
    <button data-t="overview" aria-selected="true"><span class="ic">◧</span>Overview</button>
    <button data-t="plan" aria-selected="false"><span class="ic">≡</span>Production plan</button>
    <button data-t="schedule" aria-selected="false"><span class="ic">▭</span>Schedule</button>
    <button data-t="lines" aria-selected="false"><span class="ic">▤</span>Lines</button>
    <button data-t="stock" aria-selected="false"><span class="ic">▥</span>Stock by line</button>
    <button data-t="crates" aria-selected="false"><span class="ic">▦</span>Crates</button>
    <div class="ng">Reference</div>
    <button data-t="notes" aria-selected="false"><span class="ic">i</span>Data notes</button>
    <button data-t="users" id="nav-users" aria-selected="false" hidden><span class="ic">☺</span>Users</button>
  </nav>
  <div class="sidekpi" id="sidekpi"></div>
  <div class="who" id="who"></div>
  <div class="sync" id="sync" data-s="local"><span class="dot"></span><span id="synctext">Loading…</span></div>
</aside>
<div class="content"><div class="inner">
<div id="ro" class="ro-note" hidden></div>
<main id="main"></main>
</div></div>

function stockAtStart(Lg,date){ // stock at the start of a given day

}

/* ---------------- core calculation ---------------- */
function compute(){
  const st=S.settings;
  const lineOf=S.lineOf;
  const LG=ledger(); const onHand={}; SEED.biscuits.forEach(b=>onHand[b.id]=Math.max(0,LG.onHand[b.id]));
  // products in priority order
  const prods=SEED.products.map((p,i)=>{const o=S.orders[p.id];const rem=Math.max(0,num(o.cases)-(LG.packed[p.id]||0));return {p,o,i,rem}});
  const order=prods.filter(x=>x.rem>0).sort((a,b)=>{
    const da=a.o.due||'9999-12-31', db=b.o.due||'9999-12-31';
    if(da!==db) return da<db?-1:1;
    const pa=PRIO[a.o.priority]??1, pb=PRIO[b.o.priority]??1; if(pa!==pb) return pa-pb;
    return a.i-b.i;
  });
  // required per biscuit
  const req={}; SEED.biscuits.forEach(b=>req[b.id]=0);
  order.forEach(x=>{for(const b in x.p.mix) req[b]+=x.rem*x.p.caseKg*x.p.mix[b]});
  // allocate stock by priority: whole cases first
  const avail={}; SEED.biscuits.forEach(b=>avail[b.id]=onHand[b.id]);
  const info={};
  order.forEach(x=>{
    const per={}; for(const b in x.p.mix) per[b]=x.p.caseKg*x.p.mix[b];
    let can=x.rem, lim=null; for(const b in per){const v=Math.floor(avail[b]/per[b]+1e-9); if(v<can){can=v;lim=b}}
    can=Math.max(0,can);
    for(const b in per) avail[b]-=can*per[b];
    info[x.p.id]={rem:x.rem,packNow:can,unmet:{},per,limiter:lim};
  });
  order.forEach(x=>{
    const I=info[x.p.id]; const left=x.rem-I.packNow;
    for(const b in I.per){const need=left*I.per[b];const use=Math.min(avail[b],need);avail[b]-=use;if(need-use>0.01)I.unmet[b]=need-use}

  // shortfall per biscuit
  const bis={};
  SEED.biscuits.forEach(b=>{
    const stock=onHand[b.id], r=req[b.id], short=Math.max(0,r-stock), rate=num(S.rates[b.id])||1;
    bis[b.id]={id:b.id,name:b.name,line:lineOf[b.id],req:r,stock,short,hours:short/rate,crates:short/(num(S.ref.crate[b.id])||b.crate||1),rate,crate:num(S.ref.crate[b.id])||b.crate};
  });
  // rank of each biscuit = position of most urgent product that still needs it
  const rank={}; order.forEach((x,idx)=>{for(const b in info[x.p.id].unmet) if(!(b in rank)) rank[b]=idx});

  const start=parseDate(st.start);
  const work=new Set(st.workDays);
  const co=num(st.changeover), buf=num(st.buffer);
  const isWork=d=>work.has(addDays(start,d).getDay());
  function mkCal(hpd){
    return {
      hpd,
      absToWork(abs){ if(hpd<=0) return 0; const D=Math.floor(abs/24), h=abs-D*24; let w=0; for(let d=0;d<D&&d<800;d++) if(isWork(d)) w+=hpd; if(isWork(D)) w+=Math.min(h,hpd); return w; },
      toAbs(w,atStart){ if(hpd<=0) return 0; let d=0,g=0; while(g<800){ if(isWork(d)){ if(atStart? w<hpd-1e-9 : w<=hpd+1e-9) return d*24+Math.max(0,w); w-=hpd; } d++; g++; } return d*24; },
      segs(sw,ew){ const out=[]; if(hpd<=0) return out; let cum=0; for(let d=0;d<800&&cum<ew-1e-9;d++){ if(!isWork(d)) continue; const a=Math.max(sw,cum), b=Math.min(ew,cum+hpd); if(b>a+1e-9) out.push({day:d,from:a-cum,to:b-cum}); cum+=hpd; } return out; }
    };
  }
  const byStock=(st.runOrder||'stock')==='stock';
  Object.values(bis).forEach(b=>b.cover=b.req>0?b.stock/b.req:1);
  const lines={}; const cal={};
  // pass 1: as soon as possible, in urgency order
  LINES.forEach(L=>{
    const hpd=Math.min(24,num(st.hpd[L.id])); const c=mkCal(hpd); cal[L.id]=c;
    const tasks=Object.values(bis).filter(b=>b.line===L.id&&b.short>0.5).sort(byStock?((a,b)=>(a.cover-b.cover)||((rank[a.id]??1e9)-(rank[b.id]??1e9))):((a,b)=>((rank[a.id]??1e9)-(rank[b.id]??1e9))||(a.hours-b.hours)));
    let cur=0; const runs=tasks.map((b,i)=>{ if(i>0) cur+=co; const r={b,sw:cur,ew:cur+b.hours}; cur=r.ew; return r; });
    lines[L.id]={L,hpd,tasks,runs,hours:tasks.reduce((s,b)=>s+b.hours,0),kg:tasks.reduce((s,b)=>s+b.short,0),crates:tasks.reduce((s,b)=>s+b.crates,0),allBis:Object.values(bis).filter(b=>b.line===L.id)};
  });
  const endAbs=()=>{const e={};LINES.forEach(L=>lines[L.id].runs.forEach(r=>e[r.b.id]=cal[L.id].toAbs(r.ew,false)));return e};
  const readyOf=e=>{const R={};order.forEach(x=>{let m=null;for(const b in info[x.p.id].unmet){const v=e[b];if(v!=null&&(m==null||v>m))m=v}if(m!=null)R[x.p.id]=m});return R};
  const needBy=R=>{const N={};order.forEach(x=>{const r=R[x.p.id];if(r==null)return;for(const b in info[x.p.id].unmet){if(N[b]==null||r<N[b])N[b]=r}});return N};
  const waitStats=(e,N)=>{let kgh=0,kg=0;const w={};for(const b in e){const v=Math.max(0,(N[b]??e[b])-e[b]);w[b]=v;kgh+=v*bis[b].short;kg+=bis[b].short}return {w,avg:kg?kgh/kg:0}};
  const e1=endAbs(), R1=readyOf(e1), N1=needBy(R1), asapWait=waitStats(e1,N1);
  // pass 2: just in time — every line timed to finish each biscuit just before the product can be packed
  const jit=(st.mode||'jit')==='jit';
  if(jit){

      const l=lines[L.id], c=cal[L.id]; if(!l.runs.length||c.hpd<=0) return;
      const byNeed=byStock?l.runs.slice().reverse():l.runs.slice().sort((a,b)=>(N1[b.b.id]??1e12)-(N1[a.b.id]??1e12)||((rank[b.b.id]??0)-(rank[a.b.id]??0)));
      let lim=Infinity;
      byNeed.forEach(r=>{ const due=N1[r.b.id]; let ew=due!=null?c.absToWork(Math.max(0,due-buf)):r.ew; if(lim!==Infinity) ew=Math.min(ew,lim-co); r.ew=ew; r.sw=ew-r.b.hours; lim=r.sw; });
      l.runs.sort((a,b)=>a.sw-b.sw);
      let cur=0; l.runs.forEach((r,i)=>{ const min=i?cur+co:0; if(r.sw<min){const s=min-r.sw;r.sw+=s;r.ew+=s} cur=r.ew; });
    });
  }
  const eF=endAbs(), RF=readyOf(eF), NF=needBy(RF), finalWait=waitStats(eF,NF);
  let horizon=0;
  LINES.forEach(L=>{
    const l=lines[L.id], c=cal[L.id]; const segs=[];
    l.runs.forEach((r,i)=>{
      if(i>0&&co>0) c.segs(r.sw-co,r.sw).forEach(s=>segs.push(Object.assign(s,{kind:'co'})));
      c.segs(r.sw,r.ew).forEach(s=>segs.push(Object.assign(s,{kind:'run',b:r.b})));
      const sa=c.toAbs(r.sw,true), ea=eF[r.b.id];
      r.start={day:Math.floor(sa/24),hour:sa-Math.floor(sa/24)*24};
      r.end={day:Math.floor((ea-1e-6)/24),hour:ea-Math.floor((ea-1e-6)/24)*24};
      r.wait=finalWait.w[r.b.id]||0;
      const f=order.find(x=>info[x.p.id].unmet[r.b.id]&&RF[x.p.id]===NF[r.b.id])||order.find(x=>info[x.p.id].unmet[r.b.id]);
      r.forP=f?f.p:null;
    });
    l.segs=segs;
    l.finish=l.runs.length?l.runs.reduce((m,r)=>(r.end.day*24+r.end.hour)>(m.day*24+m.hour)?r.end:m,l.runs[0].end):null;
    l.first=l.runs.length?l.runs[0].start:null;
    if(l.finish) horizon=Math.max(horizon,l.finish.day+1);
  });
  const toTime=e=>e?{date:addDays(start,e.day),hour:e.hour,abs:e.day*24+e.hour}:null;
  const absT=a=>{const d=Math.floor((a-1e-6)/24);return toTime({day:d,hour:a-d*24})};
  const plist=prods.map(x=>{
    const I=info[x.p.id]; if(!I) return {x,I:null};
    const ready=RF[x.p.id]!=null?absT(RF[x.p.id]):null;
    let late=false; if(x.o.due&&ready){const due=parseDate(x.o.due);late=ready.date>due}
    const lineSet=[...new Set(Object.keys(x.p.mix).map(b=>lineOf[b]))];
    const blockers=Object.keys(I.unmet).sort((a,b)=>(eF[b]??0)-(eF[a]??0));
    return {x,I,ready,late,lineSet,blockers,repackH:num(S.ref.repack[x.p.id])?x.rem/num(S.ref.repack[x.p.id]):null};
  });
  // ---------- crates ----------
  const ck=b=>num(S.ref.crate[b])||(BIS[b]&&BIS[b].crate)||10;
  const crInUse={}; let inUseNow=0; SEED.biscuits.forEach(b=>{const c=onHand[b.id]/ck(b.id);crInUse[b.id]=c;inUseNow+=c});
  const fillH={}, emptyH={}, casesH={}; const add=(o,d,v)=>{o[d]=(o[d]||0)+v};
  const spread=(o,a,b,v)=>{if(b-a<1e-9){add(o,Math.floor(a),v);return}let t=a;while(t<b-1e-9){const h=Math.floor(t);const e=Math.min(b,h+1);add(o,h,v*(e-t)/(b-a));t=e}};

  jobs.sort((a,b)=>a.avail-b.avail||a.i-b.i);

  jobs.forEach(j=>{const rate=num(S.ref.repack[j.x.p.id]);const st0=Math.max(rt,j.avail);const dur=rate?j.cases/rate:0;const en=st0+dur;if(rate)rt=en;

  const lastH=Math.max(0,...Object.keys(fillH).map(Number),...Object.keys(emptyH).map(Number));

  for(let d=0;d*24<=lastH;d++){const s0=cur;let f=0,e=0,cs=0,pk=cur;
    for(let h=d*24;h<d*24+24;h++){const fh=fillH[h]||0,eh=emptyH[h]||0;f+=fh;e+=eh;cs+=casesH[h]||0;cur=Math.max(0,cur+fh-eh);if(cur>pk)pk=cur}

  return {crates,LG,order,info,bis,lines,plist,start,horizon,toTime,jit,asapWait,finalWait,totalShort:Object.values(bis).reduce((s,b)=>s+b.short,0),totalReq:Object.values(req).reduce((s,v)=>s+v,0)};
}

/* ---------------- rendering ---------------- */
const $main=document.getElementById('main');
function lineDot(id,title){const L=LBY[id];return `<i class="sw" style="background:var(${L?L.v:'--muted'})" title="${esc(title||(L?L.name:id))}"></i>`}
function statusChip(pl){
  if(!pl.I) return '<span class="chip idle">No order</span>';
  if(pl.I.packNow>=pl.I.rem) return '<span class="chip ok">Pack now from stock</span>';
  if(pl.late) return '<span class="chip bad">Late for due date</span>';
  if(pl.I.packNow>0) return '<span class="chip warn">Part from stock</span>';
  return '<span class="chip warn">Waiting on production</span>';
}

function render(){
  const C=compute();
  document.querySelectorAll('#tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.t===tab?'true':'false'));
  const f=snapshotFocus();
  $main.innerHTML = ({overview:vOverview,plan:vPlan,orders:vOrders,entry:vEntry,schedule:vSchedule,lines:vLines,stock:vStock,crates:vCrates,notes:vNotes,users:vUsers,account:vAccount})[tab](C);
  const rem=C.plist.reduce((a,p)=>a+(p.I?p.I.rem:0),0), now=C.plist.reduce((a,p)=>a+(p.I?p.I.packNow:0),0);
  const oh=Object.values(C.LG.onHand).reduce((a,v)=>a+Math.max(0,v),0);
  let fin=null;LINES.forEach(L=>{const f=C.lines[L.id].finish;if(f&&(!fin||f.day*24+f.hour>fin.day*24+fin.hour))fin=f});
  const lastDay=C.LG.days.length?C.LG.days[C.LG.days.length-1].date:null;
  document.getElementById('sidekpi').innerHTML=`<div><span>Cases outstanding</span><b>${n0(rem)}</b></div><div><span>Packable now</span><b>${n0(now)}</b></div><div><span>Kg to produce</span><b>${n0(C.totalShort)}</b></div><div><span>Stock on hand</span><b>${n0(oh)} kg</b></div><div><span>Crates free</span><b>${C.crates.total?n0(C.crates.total-C.crates.inUseNow):'—'}</b></div><div><span>All made by</span><b>${fin?fmtWhen(C.toTime(fin)).split(',')[0]:'—'}</b></div><div><span>Last entry</span><b>${lastDay?fmtDay(parseDate(lastDay)):'None yet'}</b></div>`;
  restoreFocus(f);
  applyPerms();
}

function vOverview(C){
  const totalRem=C.plist.reduce((s,p)=>s+(p.I?p.I.rem:0),0);
  const packNow=C.plist.reduce((s,p)=>s+(p.I?p.I.packNow:0),0);
  const lineArr=LINES.map(L=>C.lines[L.id]);
  const lastLine=lineArr.filter(l=>l.finish).sort((a,b)=>(b.finish.day*24+b.finish.hour)-(a.finish.day*24+a.finish.hour))[0];
  const hours=lineArr.reduce((s,l)=>s+l.hours,0);
  const maxDays=Math.max(1,...lineArr.map(l=>l.hpd?l.hours/l.hpd:0));
  const recs=buildRecs(C);
  return `
  <section class="kpis">
    <div class="kpi"><span class="l">Kg to produce</span><span class="v num">${n0(C.totalShort)}</span><span class="s">${n1(hours)} line hours · rest of ${n0(C.totalReq)} kg from stock</span></div>
    <div class="kpi"><span class="l">Avg wait before packing</span><span class="v num">${n1(C.finalWait.avg)} h</span><span class="s">${C.jit?`vs ${n1(C.asapWait.avg)} h if every line started now`:'Switch to Just in time on Schedule to cut this'}</span></div>
    <div class="kpi"><span class="l">All biscuits made by</span><span class="v">${lastLine?fmtWhen(C.toTime(lastLine.finish)).split(',')[0]:'Now'}</span><span class="s">${lastLine?lastLine.L.name+' finishes last':'Stock covers every order'}</span></div>
    <div class="kpi"><span class="l">Cases packable now</span><span class="v num">${n0(packNow)}</span><span class="s">of ${n0(totalRem)} cases outstanding</span></div>
  </section>
  <div class="two">
    <section class="panel">
      <h2>What to do</h2>
      <ul class="recs">${recs.map(r=>`<li class="rec" data-k="${r.k}"><span class="tag">${r.tag}</span><div>${r.html}</div></li>`).join('')||'<li class="muted">Enter cases on the Orders tab to get a plan.</li>'}</ul>
    </section>
    <section class="panel">
      <h2>Line load</h2>
      <div style="display:grid;gap:10px">
      ${lineArr.map(l=>{const d=l.hpd?l.hours/l.hpd:0;return `<div class="loadrow"><span class="lname">${lineDot(l.L.id)}${l.L.name}</span><div class="bar" title="${n1(l.hours)} h"><i style="width:${Math.min(100,d/maxDays*100)}%;background:var(${l.L.v})"></i></div><span class="num" style="text-align:right">${l.hours>0?n1(d)+' days':'<span class="muted">idle</span>'}</span></div>`}).join('')}
      </div>
      <div class="muted" style="font-size:12px">Working days at each line's hours per day (set on the Schedule tab). Stock on hand is used first.</div>
      <h3 style="margin-top:6px">When each line starts</h3>
      <div style="display:grid;gap:6px">
      ${lineArr.map(l=>{const r=l.runs[0];return `<div style="display:flex;gap:8px;align-items:baseline;justify-content:space-between;border-top:1px solid var(--rule-2);padding-top:6px"><span class="lname" style="font-size:14px">${lineDot(l.L.id)}${l.L.name}</span><span style="flex:1">${r?esc(r.b.name):'<span class="muted">Nothing needed</span>'}</span><span class="num muted">${r?fmtWhen(C.toTime(r.start)):''}</span></div>`}).join('')}
      </div>
    </section>
  </div>`;
}

function buildRecs(C){
  const R=[];
  const ready=C.plist.filter(p=>p.I&&p.I.packNow>0);
  if(ready.length){
    R.push({k:'go',tag:'Pack now',html:'Stock already covers '+ready.map(p=>`<b>${n0(p.I.packNow)} cs ${esc(p.x.p.name)}</b>`).join(', ')+'. Send these to repacking while the lines run.'});
  }
  const L=LINES.map(l=>C.lines[l.id]).filter(l=>l.hours>0);
  if(L.length){
    const worst=L.slice().sort((a,b)=>b.hours/b.hpd-a.hours/a.hpd)[0];
    const d=worst.hours/worst.hpd;
    const others=L.filter(l=>l!==worst).map(l=>l.hours/l.hpd);
    const next=others.length?Math.max(...others):0;
    if(d>next*1.5&&d>1) R.push({k:'warn',tag:'Bottleneck',html:`<b>${worst.L.name}</b> needs ${n1(d)} working days (${n1(worst.hours)} h), ${next?`more than any other line (next is ${n1(next)} days)`:'and is the only line with work'}. Start it today and consider extra shifts there. Its slowest run is <b>${esc(worst.tasks.slice().sort((a,b)=>b.hours-a.hours)[0].name)}</b>.`});
  }
  if(C.jit){
    LINES.map(l=>C.lines[l.id]).filter(l=>l.first&&(l.first.day*24+l.first.hour)>=8).forEach(l=>{
      R.push({k:'info',tag:'Timed',html:`<b>${l.L.name}</b> starts ${fmtWhen(C.toTime(l.first))} so its biscuits come off just before they're packed. It's free until then for other work.`});
    });
    if(C.asapWait.avg-C.finalWait.avg>1) R.push({k:'go',tag:'Less waiting',html:`Timing lines to the slowest line cuts the average wait between baking and packing from <b>${n1(C.asapWait.avg)} h to ${n1(C.finalWait.avg)} h</b>.`});
  }
  {const ov=SEED.biscuits.map(b=>({b,c:C.bis[b.id],p:stockPos(C.bis[b.id])})).filter(x=>x.p.k==='over').sort((a,b)=>b.p.diff-a.p.diff).slice(0,4);
   if(ov.length) R.push({k:'info',tag:'Overstock',html:'Most surplus stock: '+ov.map(x=>`<b>${esc(x.b.name)}</b> +${n0(x.p.diff)} kg${x.c.req<=0.5?' (no current orders)':''}`).join(', ')+'. Don\'t make more of these; see the Stock by line tab.'});}
  const late=C.plist.filter(p=>p.late);
  late.forEach(p=>R.push({k:'bad',tag:'Late',html:`<b>${esc(p.x.p.name)}</b> is due ${fmtDay(parseDate(p.x.o.due))} but its last biscuit (${esc(C.bis[p.blockers[0]].name)}) is ready ${fmtWhen(p.ready)}. Raise its priority, add hours on ${[...new Set(p.blockers.map(b=>LBY[C.bis[b].line].name))].join(' / ')}, or agree a new date.`}));
  const waiting=C.plist.filter(p=>p.I&&p.I.packNow<p.I.rem&&!p.late).sort((a,b)=>(a.ready?.abs??0)-(b.ready?.abs??0)).slice(0,4);
  waiting.forEach(p=>{
    const bl=p.blockers.slice(0,3).map(b=>`${esc(C.bis[b].name)} <span class="muted">(${LBY[C.bis[b].line].name})</span>`).join(', ');
    R.push({k:'info',tag:'Waiting',html:`<b>${esc(p.x.p.name)}</b>: ${n0(p.I.rem-p.I.packNow)} cs waiting on ${bl}${p.blockers.length>3?` +${p.blockers.length-3} more`:''}. Ready to pack ${fmtWhen(p.ready)}.`});
  });
  const idle=LINES.filter(l=>C.lines[l.id].hours===0);
  if(idle.length&&L.length){
    idle.forEach(l=>{
      const b=C.lines[l.id].allBis.filter(b=>b.req>0).sort((a,b)=>(a.stock-a.req)-(b.stock-b.req))[0];
      R.push({k:'info',tag:'Spare line',html:`<b>${l.name}</b> has nothing to make for these orders.${b?` If you want to build stock, <b>${esc(b.name)}</b> has the least cover (${n0(b.stock)} kg on hand vs ${n0(b.req)} kg used by current orders).`:''}`});
    });
  }
  return R;
}

let planView='day', copyMsg='';
function clock(h){const t=SHIFT_START+h;const H=Math.floor(t)%24, M=Math.round((t-Math.floor(t))*60);return String(M===60?(H+1)%24:H).padStart(2,'0')+':'+String(M===60?0:M).padStart(2,'0')}
function planRows(C){
  if(planView==='run'){
    const rows=[];
    const lineOrder=LINES.map(L=>C.lines[L.id]).filter(l=>l.runs.length).sort((a,b)=>b.hours/(b.hpd||24)-a.hours/(a.hpd||24));
    lineOrder.forEach(l=>l.runs.forEach((r,i)=>rows.push({day:null,L:l.L,rank:i+1,b:r.b,from:fmtWhen(C.toTime(r.start)),to:fmtWhen(C.toTime(r.end)),hours:r.b.hours,kg:r.b.short,crates:r.b.crates,forP:r.forP,wait:r.wait})));
    return rows;
  }
  const rows=[];
  LINES.forEach(L=>{const l=C.lines[L.id];const rmap=Object.fromEntries(l.runs.map(r=>[r.b.id,r]));
    l.segs.filter(s=>s.kind==='run').forEach(s=>{const h=s.to-s.from;const r=rmap[s.b.id];rows.push({day:s.day,L,b:s.b,from:clock(s.from),to:clock(s.to),fromH:s.from,hours:h,kg:h*s.b.rate,crates:h*s.b.rate/(s.b.crate||1),forP:r&&r.forP,wait:r?r.wait:0,part:Math.abs(h-s.b.hours)>0.01})});
  });
  rows.sort((a,b)=>a.day-b.day||a.fromH-b.fromH||LINES.indexOf(a.L)-LINES.indexOf(b.L));
  return rows;
}
function vPlan(C){
  const rows=planRows(C);
  const totKg=rows.reduce((s,r)=>s+r.kg,0), totH=rows.reduce((s,r)=>s+r.hours,0);
  let body='';
  if(!rows.length) body='<tr class="dim"><td colspan="10">Nothing to produce: stock covers every order.</td></tr>';
  else if(planView==='day'){
    const days=[...new Set(rows.map(r=>r.day))];
    days.forEach(d=>{
      const dr=rows.filter(r=>r.day===d);const kg=dr.reduce((s,r)=>s+r.kg,0);
      const perLine=LINES.map(L=>{const h=dr.filter(r=>r.L===L).reduce((s,r)=>s+r.hours,0);return h?`${lineDot(L.id)} ${L.name} ${n1(h)} h`:''}).filter(Boolean).join(' &nbsp; ');
      body+=`<tr class="group"><td colspan="10">${fmtDay(addDays(C.start,d))} <span class="muted" style="font:500 12px var(--mono);text-transform:none;letter-spacing:0">· ${n0(kg)} kg · ${perLine}</span></td></tr>`;
      body+=dr.map(r=>row(r)).join('');
    });
  } else {
    const byStock=(S.settings.runOrder||'stock')==='stock';
    [...new Set(rows.map(r=>r.L))].forEach(L=>{
      const lr=rows.filter(r=>r.L===L), l=C.lines[L.id];
      body+=`<tr class="group"><td colspan="10">${lineDot(L.id)} ${L.name} <span class="muted" style="font:500 12px var(--mono);text-transform:none;letter-spacing:0">· ${lr.length} runs · ${n0(lr.reduce((a,r)=>a+r.kg,0))} kg · ${n1(l.hours)} h · ${n1(l.hpd?l.hours/l.hpd:0)} days · ranked by ${byStock?'lowest stock first':'most urgent order first'}</span></td></tr>`;
      body+=lr.map(r=>row(r)).join('');
    });
  }
  function row(r){return `<tr><td><span class="lname" style="font-size:14px">${r.rank?`<span class="rk">${r.rank}</span>`:''}${lineDot(r.L.id)}${r.L.name}</span></td><td>${esc(r.b.name)}${r.part?' <span class="muted" style="font-size:11px">(part)</span>':''}</td><td class="num">${r.from}</td><td class="num">${r.to}</td><td class="r num"><b>${n0(r.kg)}</b></td><td class="r num">${n1(r.hours)}</td><td class="r num">${n0(r.crates)}</td><td class="r num">${Math.round(Math.min(1,r.b.cover)*100)}%</td><td>${r.forP?esc(r.forP.name):''}</td><td>${r.wait>12?`<span class="chip warn">${n1(r.wait)} h</span>`:`<span class="num muted">${n1(r.wait)} h</span>`}</td></tr>`}
  return `<section class="toolbar">
    <div class="grp"><h2>Production plan</h2><span class="muted">${C.jit?'Just in time':'As soon as possible'} · starts ${fmtDay(C.start)} · ${n0(totKg)} kg in ${n1(totH)} line hours</span></div>
    <div class="grp"><div class="days mode"><button data-pv="day" aria-pressed="${planView==='day'}">By day</button><button data-pv="run" aria-pressed="${planView==='run'}">By run</button></div>
    <button class="btn primary" data-act="copy">Copy for Excel</button><span class="muted" id="copymsg" style="font-size:12px">${copyMsg}</span></div></section>
  <div class="tablebox"><table>
    <thead><tr><th>${planView==='run'?'Run # · Line':'Line'}</th><th>Biscuit</th><th>Start</th><th>Finish</th><th class="r">Kg</th><th class="r">Hours</th><th class="r">Crates</th><th class="r">Stock cover</th><th>For</th><th>Waits before packing</th></tr></thead>
    <tbody>${body}</tbody>
    <tfoot><tr><td colspan="4"><b>Total</b></td><td class="r num"><b>${n0(totKg)}</b></td><td class="r num"><b>${n1(totH)}</b></td><td class="r num">${n0(rows.reduce((s,r)=>s+r.crates,0))}</td><td colspan="3"></td></tr></tfoot>
  </table></div>
  <div class="legend"><span>Times follow the Schedule tab settings (days start 06:00). “Part” means the run carries on into the next working day.</span></div>`;
}
function planTSV(C){
  const rows=planRows(C);
  const head=['Date / run #','Line','Biscuit','Start','Finish','Kg','Hours','Crates','Stock cover %','For product','Waits (h)'];
  return [head.join('\t')].concat(rows.map(r=>[r.day!=null?fmtDay(addDays(C.start,r.day)):r.rank,r.L.name,r.b.name,r.from,r.to,Math.round(r.kg),r.hours.toFixed(1),Math.round(r.crates),Math.round(Math.min(1,r.b.cover)*100),r.forP?r.forP.name:'',r.wait.toFixed(1)].join('\t'))).join('\n');
}
let pending=null;
function confirmBtn(key,label,q){
  if(pending===key) return `<span class="confirm">${q} <button class="btn danger" data-act="${key}-yes">Yes</button><button class="btn" data-act="cancel">No</button></span>`;
  return `<button class="btn" data-act="${key}">${label}</button>`;
}

function vSchedule(C){
  const st=S.settings;
  const days=Math.max(7,Math.min(60,C.horizon+1));
  const W=76; // px per day
  const work=new Set(st.workDays);
  const head=[];for(let i=0;i<days;i++){const d=addDays(C.start,i);head.push(`<div class="c${work.has(d.getDay())?'':' off'}" style="width:${W}px"><b>${DAYN[d.getDay()]}</b>${d.getDate()} ${MON[d.getMonth()]}</div>`)}
  const rows=LINES.map(L=>{
    const l=C.lines[L.id];
    const cells=[];for(let i=0;i<days;i++){const d=addDays(C.start,i);cells.push(`<div class="c${work.has(d.getDay())?'':' off'}" style="width:${W}px"></div>`)}
    const blks=l.segs.filter(s=>s.day<days).map(s=>{
      const left=s.day*W+(s.from/24)*W, w=Math.max(2,((s.to-s.from)/24)*W);
      if(s.kind==='co') return `<div class="blk co" style="left:${left}px;width:${w}px" title="Changeover"></div>`;
      return `<div class="blk${L.light?' light':''}" style="left:${left}px;width:${w}px;background:var(${L.v})" title="${esc(s.b.name)} · ${n0(s.b.short)} kg · ${n1(s.b.hours)} h">${w>34?esc(s.b.name):''}</div>`;
    }).join('');
    return `<div class="g-row"><div class="g-lab">${lineDot(L.id)}${L.name}</div><div class="track" style="width:${days*W}px">${cells.join('')}${blks}</div></div>`;
  }).join('');
  const runs=LINES.map(L=>{
    const l=C.lines[L.id];
    return `<section class="lc" style="--lc:var(${L.v})"><header><h3>${L.name} run order</h3><span class="num muted">${l.first?'starts '+fmtWhen(C.toTime(l.first)).replace(/^\w+ /,'')+' · ':''}${n1(l.hours)} h</span></header>
    ${l.runs.length?`<ol class="seq">${l.runs.map(r=>`<li><span>${esc(r.b.name)} <span class="num muted">${n0(r.b.short)} kg</span></span><span class="when">${fmtWhen(C.toTime(r.start)).replace(/^\w+ /,'')} → ${fmtWhen(C.toTime(r.end)).replace(/^\w+ /,'')}</span><span class="why">${'Stock covers '+Math.round(Math.min(1,r.b.cover)*100)+'% · '}${r.forP?'for '+esc(r.forP.name)+(S.orders[r.forP.id].due?' (due '+fmtDay(parseDate(S.orders[r.forP.id].due))+')':'')+' · ':''}${r.wait>12?`<span class="chip warn">waits ${n1(r.wait)} h</span>`:r.wait>0.5?`waits ${n1(r.wait)} h before packing`:'packed as it comes off'}</span></li>`).join('')}</ol>`:'<div class="none">Nothing to make — stock covers these orders.</div>'}</section>`;
  }).join('');
  return `<section class="panel">
    <div class="toolbar"><h2>Plan settings</h2><span class="muted" style="font-size:12px">${(st.runOrder||'stock')==='stock'?'Each line runs the biscuit with the least stock (compared with what the orders need) first. ':'Each line runs biscuits in order of the most urgent order. '}${st.mode==='asap'?'Every line starts straight away.':'The slowest line for each product sets its packing time. Other lines are timed so their biscuits come off just before packing, not days early.'} Days start at 06:00.</span></div>
    <div class="settings">
      <label class="field"><b>Start date</b><input type="date" id="set-start" data-s="start" value="${esc(st.start)}"></label>
      <div class="field"><b>Working days</b><div class="days">${[1,2,3,4,5,6,0].map(d=>`<button data-wd="${d}" aria-pressed="${st.workDays.includes(d)}">${DAYN[d]}</button>`).join('')}</div></div>
      <div class="field"><b>Timing</b><div class="days mode">${[['jit','Just in time'],['asap','As soon as possible']].map(([k,t])=>`<button data-mode="${k}" aria-pressed="${(st.mode||'jit')===k}">${t}</button>`).join('')}</div></div>
      <div class="field"><b>Run order on each line</b><div class="days mode">${[['stock','Lowest stock first'],['urgent','Most urgent order first']].map(([k,t])=>`<button data-ro="${k}" aria-pressed="${(st.runOrder||'stock')===k}">${t}</button>`).join('')}</div></div>
      <label class="field"><b>Ready before packing (h)</b><input type="number" min="0" step="1" id="set-buf" data-s="buffer" value="${num(st.buffer)}" style="width:70px"></label>
      <label class="field"><b>Changeover (h)</b><input type="number" min="0" step="0.25" id="set-co" data-s="changeover" value="${num(st.changeover)}" style="width:70px"></label>
      <div class="field"><b>Hours per day, by line</b><div class="hpd">${LINES.map(L=>`<label>${lineDot(L.id)}${L.name}<input type="number" min="0" max="24" step="1" id="hpd-${L.id}" data-h="${L.id}" value="${num(st.hpd[L.id])}"></label>`).join('')}</div></div>
    </div>
  </section>
  <section style="display:grid;gap:8px"><h2>Line schedule</h2>
  <div class="gantt"><div class="g-inner" style="width:${96+days*W}px">
    <div class="g-head"><div class="g-lab">Line</div><div class="cells">${head.join('')}</div></div>${rows}
  </div></div>
  <div class="legend"><span><i class="sw" style="background:repeating-linear-gradient(135deg,var(--off) 0 3px,transparent 3px 6px);border:1px solid var(--rule)"></i> Not a working day</span><span>Hover a block for kg and hours.</span></div></section>
  <div class="runs">${runs}</div>`;
}

    body=`<section class="panel" style="gap:10px">
      <div class="toolbar"><div class="grp"><button class="btn" data-ed="-1" aria-label="Previous day">‹</button><input type="date" id="entry-date" value="${d}" aria-label="Entry date"><button class="btn" data-ed="1" aria-label="Next day">›</button>${d!==todayISO()?'<button class="btn" data-ed="0">Today</button>':''}<b style="font:600 18px var(--display);text-transform:uppercase;letter-spacing:.04em">${fmtDay(parseDate(d))}</b></div>

        <thead><tr><th>Biscuit</th><th class="r">Start of day</th><th class="r">+ Produced</th><th class="r">− Used by packing</th><th class="r">= Kg left</th></tr></thead>
        <tbody>${kgRows}</tbody></table></div></section>

function stockPos(c){

  if(c.stock<c.req-0.5) return {k:'short',label:'Short',diff:c.stock-c.req};
  if(c.stock>c.req*over) return {k:'over',label:'Overstocked',diff:c.stock-c.req};
  return {k:'ok',label:'OK',diff:c.stock-c.req};
}

    const rows=mix.map(([b,f])=>{const gp=g*f, pw=num(S.ref.pieceG[b]); const pcs=pw?gp/pw:null; tg+=gp; if(pcs!=null) tpc+=pcs; else known=false;

      <label class="field"><b>Packs / trays per case</b><input class="in" type="number" min="1" step="1" id="pn-${p.id}" data-pn="${p.id}" value="${n||''}" style="width:80px"></label>
      <label class="field"><b>Pack weight (g)</b><input class="in" type="number" min="1" step="1" id="pw-${p.id}" data-pw="${p.id}" value="${g||''}" style="width:90px"></label>
      <div class="field"><b>Case weight</b><span class="num" style="color:var(--ink);font-size:15px">${p.caseKg} kg${n&&g&&Math.abs(n*g/1000-p.caseKg)>0.01?` <span class="chip warn">packs give ${n1(n*g/1000)} kg</span>`:''}</span></div></div>
    <div class="tablebox"><table class="compact"><thead><tr><th>Biscuit</th><th class="r">Share</th><th class="r">Grams per pack</th><th class="r">Biscuits per pack</th><th class="r">Per case (g)</th><th class="r">Per case (kg)</th></tr></thead><tbody>${rows}</tbody>
    <tfoot><tr><td><b>Total per pack</b></td><td class="r num">100%</td><td class="r num"><b>${n1(tg)} g</b></td><td class="r num">${known?'<b>'+n0(tpc)+'</b>':'<span class="muted">add weights</span>'}</td><td class="r num">${n0(p.caseKg*1000)} g</td><td class="r num">${p.caseKg}</td></tr></tfoot></table></div>
    <div class="legend"><span>Grams per pack = pack weight × each biscuit's share of the recipe. Biscuits per pack need the single-biscuit weights on the Biscuit weights tab. ● = product has an order.</span></div></section>`;
  }
  return head+`<div class="notes">
  <h2>How the planner reads your workbook</h2>
  <div class="note"><h3>Recipes, rates and stock</h3><p>Each product's biscuit mix, case weight, kg per hour and kg per crate come from the OPEN sheet of KIM.xlsx. Line colours follow your key: red FGC 2, blue Polin, yellow Wafer, green FGC 1, black Laser. Stock is used first and given to products in order of due date, then priority.</p></div>
  <div class="note"><h3>Stock on hand</h3><p>Stock on hand = opening stock + kg produced − kg used by packing, counted from the opening stock date. Each case packed uses its recipe: case weight × each biscuit's share. Cases packed also come off the outstanding orders.</p></div>
  <div class="note"><h3>Fixed: Pink Wafer counted as 0</h3><p>In the workbook, cell C216 is typed as 0, so the 8.35% (200g) and 5.56% (400g/800g) Pink Wafer share of DVF Choice was never counted. That's why components added up to 122,851 kg against a 124,920 kg budget. The planner includes it.</p></div>
  <div class="note"><h3>Fixed: 14×200g cases counted at 4.8 kg</h3><p>Nordthy Biscuit for Cheese 14×200g and Signature Cracker Box 14×200g are 2.8 kg cases, but the workbook uses the 24×200g (4.8 kg) mix for their biscuits, which overstates what they need by about 70%. The planner uses the same mix at 2.8 kg per case.</p></div>
  <div class="note"><h3>Check: DVF Cracker Mix 24×200g</h3><p>Its recipe has six crackers (including Pumpkin &amp; Sunflower and Rosemary &amp; Thyme) that map onto five biscuits here, and the SA Cream Cracker share is added twice in the workbook's formula (cell C223). The planner scales the mix to 4.8 kg per case. Please confirm the recipe before ordering it.</p></div>
  <div class="note"><h3>Timing</h3><p>Run order: by default each line runs first the biscuit with the lowest stock compared with what the orders need (0% stock first). You can switch to most urgent order first on the Schedule tab. Line hours = kg to make ÷ kg per hour. Just in time (the default) first works out when each product can be packed, which the slowest line sets. It then times every other line backwards so each biscuit comes off the chosen number of hours before packing. As soon as possible starts every line straight away instead. Lines run on their own working days and hours per day, with an optional changeover between runs. Repack hours use your repacking rates: 60 cases per hour, or 50 for PnP Xmas and RISI.</p></div>
  </div>`;
}

let ref=null, dirty=false, saving=false, again=false, st=null, readOnly=false;
function setSync(s,txt){const el=document.getElementById('sync');el.dataset.s=s;document.getElementById('synctext').textContent=txt}
function serial(){return {orders:S.orders,opening:S.opening,rates:S.rates,ref:S.ref,lineOf:S.lineOf,settings:S.settings,onlyActive:S.onlyActive,savedAt:new Date().toISOString()}}
function saveLocal(){try{localStorage.setItem('alp-plan',JSON.stringify(Object.assign(serial(),{log:S.log})))}catch(e){}}
let logCol=null, logDirty=new Set(), logTimer=null, logSaving=false;
function changedLog(d){logDirty.add(d);clearTimeout(rt);rt=setTimeout(render,200);if(!logCol){saveLocal();logDirty.clear();return}setSync('saving','Saving…');clearTimeout(logTimer);logTimer=setTimeout(saveLogs,900)}
async function saveLogs(){
  if(logSaving){clearTimeout(logTimer);logTimer=setTimeout(saveLogs,500);return}
  logSaving=true; const ds=[...logDirty]; logDirty.clear();
  try{for(const d of ds){const e=S.log[d]; const empty=!e||(!Object.keys(e.made||{}).length&&!Object.keys(e.packed||{}).length);
      if(empty){delete S.log[d];await logCol.doc(d).delete()} else await logCol.doc(d).set({date:d,made:e.made||{},packed:e.packed||{}})}
    setSync('saved','Saved · shared with your team')}
  catch(e){ds.forEach(d=>logDirty.add(d)); if(e&&e.code==='invalid_argument'){readOnly=true;document.getElementById('ro').hidden=false;setSync('error','View only')} else setSync('error','Not saved, will retry on next change')}
  logSaving=false;
}
function queueSave(){
  if(!PERM.canPlan){dirty=false;return}
  if(!ref){saveLocal();dirty=false;return}
  setSync('saving','Saving…');clearTimeout(st);st=setTimeout(doSave,900);
}
async function doSave(){
  if(saving){again=true;return}
  saving=true;dirty=false;
  try{await ref.set(serial());setSync('saved','Saved · shared with your team')}
  catch(e){
    if(e&&e.code==='invalid_argument'){readOnly=true;document.getElementById('ro').hidden=false;setSync('error','View only')}
    else setSync('error','Not saved, will retry on next change');
  }
  saving=false; if(again){again=false;doSave()}
}

    const bad=e=>{if(errMsg(e)){setSync('error','No access to the plan data')}else setSync('error','Connection lost. Reload to reconnect')};

const app = initializeApp(FIREBASE_CONFIG);
const auth = getAuth(app);
const db = getDatabase(app);
try { await setPersistence(auth, browserLocalPersistence); } catch (e) {}
const ROLES = { admin: 'Administrator', planner: 'Planner', shift: 'Shift leader', viewer: 'Viewer' };
const friendly = e => {
  const c = (e && e.code) || '';
  if (/invalid-credential|wrong-password|user-not-found|invalid-login/.test(c)) return 'Email or password is wrong.';
  if (/invalid-email/.test(c)) return 'That email address is not valid.';
  if (/email-already-in-use/.test(c)) return 'This email already has an account.';
  if (/weak-password/.test(c)) return 'Password too weak: use at least 6 characters.';
  if (/too-many-requests/.test(c)) return 'Too many tries. Wait a few minutes and try again.';
  if (/network/.test(c)) return 'No internet connection.';
  if (/permission/i.test(c + (e && e.message))) return 'Not allowed by the database rules.';
  return 'Something went wrong (' + (c || (e && e.message)) + ').';
};
let initialized = true;
async function checkInit() { try { const s = await get(ref(db, 'assortment/meta/initialized')); initialized = s.val() === true; } catch (e) { initialized = true; } $('setupForm').hidden = initialized; $('loginForm').hidden = !initialized; }
checkInit();
$('loginForm').addEventListener('submit', async ev => {
  ev.preventDefault(); msg(''); $('lg-go').disabled = true;
  try { await signInWithEmailAndPassword(auth, $('lg-email').value.trim(), $('lg-pass').value); } catch (e) { msg(friendly(e)); }
  $('lg-go').disabled = false;
});
$('lg-reset').addEventListener('click', async () => {
  const em = $('lg-email').value.trim();
  if (!em) { msg('Type your email first, then tap Forgot password.'); return; }
  try { await sendPasswordResetEmail(auth, em); msg('Password reset email sent to ' + em + '.', true); } catch (e) { msg(friendly(e)); }
});
let bootstrapping = false;
$('setupForm').addEventListener('submit', async ev => {
  ev.preventDefault(); msg(''); $('su-go').disabled = true; bootstrapping = true;
  try {
    const cred = await createUserWithEmailAndPassword(auth, $('su-email').value.trim(), $('su-pass').value);
    await set(ref(db, 'assortment/users/' + cred.user.uid), { name: $('su-name').value.trim(), email: cred.user.email, role: 'admin', disabled: false, createdAt: new Date().toISOString() });
    await set(ref(db, 'assortment/meta/initialized'), true);
    bootstrapping = false; handleUser(cred.user);
  } catch (e) { bootstrapping = false; msg(friendly(e)); try { await signOut(auth); } catch (_) {} }
  $('su-go').disabled = false;
});
function setRole(p) {
  const r = p.role;
  window.PERM.role = r; window.PERM.isAdmin = r === 'admin';
  window.PERM.canPlan = r === 'admin' || r === 'planner';
  window.PERM.canLog = window.PERM.canPlan || r === 'shift';
  $('nav-users').hidden = !window.PERM.isAdmin;
  const ro = $('ro');
  if (r === 'viewer') { ro.textContent = 'You have view-only access. Ask an administrator if you need to enter data.'; ro.hidden = false; }
  else if (r === 'shift') { ro.textContent = 'Shift leader access: you can enter daily kg produced and cases packed. Other figures are view-only.'; ro.hidden = false; }
  else ro.hidden = true;
  $('who').innerHTML = '<span><b></b><br><span class="rl"></span></span><div class="row"><button class="btn" type="button" id="myacc">My account</button><button class="btn" type="button" id="signout">Sign out</button></div>';
  $('who').querySelector('b').textContent = p.name || p.email || '';
  $('who').querySelector('.rl').textContent = ROLES[r] || '';
  $('signout').onclick = () => signOut(auth);
  $('myacc').onclick = () => { document.querySelector('#tabs button[data-t="overview"]'); window.tabGo && window.tabGo('account'); };
}
let connected = false, usersUnsub = null, lastRole = null;
async function handleUser(u) {
  let prof = null;
  try { prof = (await get(ref(db, 'assortment/users/' + u.uid))).val(); } catch (e) {}
  if (!prof || prof.disabled) {
    await signOut(auth);
    msg(prof && prof.disabled ? 'This account has been disabled. Ask the administrator.' : 'This account is not set up for the planner. Ask the administrator to add you.');
    return;
  }
  window.ME = Object.assign({ uid: u.uid }, prof);
  setRole(prof); lastRole = prof.role;
  document.body.classList.remove('locked');
  onValue(ref(db, 'assortment/users/' + u.uid), s => {
    const p = s.val();
    if (!p || p.disabled) { signOut(auth); return; }
    window.ME = Object.assign({ uid: u.uid }, p);
    if (p.role !== lastRole) { lastRole = p.role; setRole(p); if (usersUnsub && !window.PERM.isAdmin) { usersUnsub(); usersUnsub = null; } if (window.PERM.isAdmin && !usersUnsub) watchUsers(); }
    else setRole(p);
    window.APP.rerender();
  });
  if (window.PERM.isAdmin) watchUsers();
  if (!connected) {
    connected = true;
    window.APP.connect({ set: (p, v) => set(ref(db, p), v), remove: p => remove(ref(db, p)), onValue: (p, cb, err) => onValue(ref(db, p), s => cb(s.val()), err) });
  }
  window.APP.rerender();
}
function watchUsers() {
  usersUnsub = onValue(ref(db, 'assortment/users'), s => { const v = s.val() || {}; window.USERS = Object.entries(v).map(([uid, p]) => Object.assign({ uid }, p)); window.APP.rerender(); }, () => {});
}
onAuthStateChanged(auth, u => {
  if (u) { if (!bootstrapping) handleUser(u); }
  else { if (connected) { location.reload(); return; } document.body.classList.add('locked'); checkInit(); }
});
window.UM = {
  async create(d) {
    let sec = null;
    try {
      sec = initializeApp(FIREBASE_CONFIG, 'add-' + Date.now());
      const a2 = getAuth(sec);
      const cred = await createUserWithEmailAndPassword(a2, d.email, d.password);
      await signOut(a2);
      await set(ref(db, 'assortment/users/' + cred.user.uid), { name: d.name, email: cred.user.email, role: d.role, disabled: false, createdAt: new Date().toISOString(), createdBy: auth.currentUser.uid });
      return 'Added ' + d.name + ' as ' + ROLES[d.role] + '. Give them their email and temporary password.';
    } catch (e) { return friendly(e); }
    finally { if (sec) { try { await deleteApp(sec); } catch (_) {} } }
  },
  async update(uid, patch) { try { await update(ref(db, 'assortment/users/' + uid), patch); } catch (e) { alert(friendly(e)); } },
  async reset(email) { try { await sendPasswordResetEmail(auth, email); return 'Password reset email sent to ' + email + '.'; } catch (e) { return friendly(e); } },
  async changePw(cur, nw) {
    try { const u = auth.currentUser; await reauthenticateWithCredential(u, EmailAuthProvider.credential(u.email, cur)); await updatePassword(u, nw); return 'Password changed.'; }
    catch (e) { return friendly(e); }
  }
};
</script>
</body></html>
